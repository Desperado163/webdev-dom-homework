<!DOCTYPE html>

  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const inputEl = document.querySelector('.add-form-name');
    const textareaEl = document.querySelector('.add-form-text');
    const addBtnEl = document.querySelector('.add-form-button');
    const commentsEl = document.querySelector('.comments');
    const now = new Date();
    const dateString = now.toLocaleDateString('ru-RU') + ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit'});

    const commentsGroup = [
      {
        name: "Глеб Фокин",
        date: new Date(),
        text: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLiked: false,
      },
      {
        name: "Варвара Н.",
        date: new Date(),
        text: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLiked: true,
      }
    ]
    
    const initClickLikes = () => {
      const likes = document.querySelectorAll(".like-button");

      for (const like of likes) {
        like.addEventListener ("click", () => {
          const index = like.dataset.index;
          const comment = commentsGroup[index];

          if (comment.isLiked) {
            comment.likes--;
            comment.isLiked = false;
          } else {
            comment.likes++;
            comment.isLiked = true;
          }
          renderComments();
        })
      }
    } 

    const renderComments = () => {
      commentsEl.innerHTML = commentsGroup.map((comment,index) => {
        return `        
        <li class="comment">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${dateString}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button data-index="${index}" class="like-button ${comment.isLiked ? '-active-like' : ''}"></button>
            </div>
          </div>
        </li>
        `
      }).join("");

      initClickLikes();
    }

    renderComments();

    addBtnEl.addEventListener('click', () => {
      console.log('click');

      let validError = false;

      if (inputEl.value.trim() === '') {
        inputEl.classList.add('error');
        inputEl.placeholder = 'Нужно ввести имя!!!';
        console.log('Error!!!');
        validError = true;
      } else {
        inputEl.classList.remove('error');
      }

      if (textareaEl.value.trim() === '') {
        textareaEl.classList.add('error');
        textareaEl.placeholder = 'Нужно ввести сообщение!!!';
        console.log('Error!!!');
        validError = true;
      } else {
        textareaEl.classList.remove('error');
      }

      if (validError) return;

      console.log('Всё ОК!!!');

      commentsGroup.push(
        {
          name: inputEl.value,

          text: textareaEl.value,
          likes: 0,

        }
