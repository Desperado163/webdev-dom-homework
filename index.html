<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const inputEl = document.querySelector('.add-form-name');
    const textareaEl = document.querySelector('.add-form-text');
    const addBtnEl = document.querySelector('.add-form-button');
    const commentsEl = document.querySelector('.comments');

    addBtnEl.addEventListener('click', () => {
      console.log('click');

      let validError = false;

      if (inputEl.value === '') {
        inputEl.classList.add('error');
        inputEl.placeholder = 'Нужно ввести имя!!!';
        console.log('Error!!!');
        validError = true;
      } else {
        inputEl.classList.remove('error');
      }

      if (textareaEl.value === '') {
        textareaEl.classList.add('error');
        textareaEl.placeholder = 'Нужно ввести сообщение!!!';
        console.log('Error!!!');
        validError = true;
      } else {
        textareaEl.classList.remove('error');
      }

      if (validError) return;

      console.log('Всё ОК!!!');
      
      const commentEl = document.createElement('li');
      commentEl.classList.add('comment');
      commentsEl.appendChild(commentEl);

      const commentHeaderEl = document.createElement('div');
      commentHeaderEl.classList.add('comment-header');
      commentEl.appendChild(commentHeaderEl);

      const userNameEl = document.createElement('div');
      userNameEl.textContent = inputEl.value.trim();
      commentHeaderEl.appendChild(userNameEl);

      const dataEl = document.createElement('div');
      const d = new Date();
      const datePart = d.toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: '2-digit'
      });

      const timePart = d.toLocaleTimeString('ru-RU', {
        hour: '2-digit',
        minute: '2-digit'
      });
      dataEl.textContent = `${datePart} ${timePart}`;
      commentHeaderEl.appendChild(dataEl);

      const commentBodyEl = document.createElement('div');
      commentBodyEl.classList.add('comment-body');
      commentEl.appendChild(commentBodyEl);

      const commentTextEl = document.createElement('div');
      commentTextEl.classList.add('comment-text');
      commentTextEl.innerHTML = textareaEl.value.trim();
      commentBodyEl.appendChild(commentTextEl);

      const commentFooterEl = document.createElement('div');
      commentFooterEl.classList.add('comment-footer');
      commentEl.appendChild(commentFooterEl);

      const likesEl = document.createElement('div');
      likesEl.classList.add('likes');
      commentFooterEl.appendChild(likesEl);

      let likesCounter = 0;

      const likesCounterEl = document.createElement('span');
      likesCounterEl.classList.add('likes-counter');
      likesCounterEl.textContent = likesCounter;
      likesEl.appendChild(likesCounterEl);

      const likeBtnEl = document.createElement('button');
      likeBtnEl.classList.add('like-button');
      likesEl.appendChild(likeBtnEl);

      likeBtnEl.addEventListener('click', () => {
        likesCounterEl.innerHTML = ++likesCounter;
      });

      inputEl.value = '';
      textareaEl.value = '';
    });
    console.log("It works!");
  </script>
</html>
